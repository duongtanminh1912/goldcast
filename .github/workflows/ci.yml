name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Keep the required-check name already protected on main. All G1 steps must
  # pass before this check becomes green; no branch-protection bypass is needed.
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Chay test backend
        working-directory: backend
        run: mvn -B test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test release, rollback and operator commands
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Test public release verification and runtime snapshots
        run: node --test scripts/tests/test_*.mjs
