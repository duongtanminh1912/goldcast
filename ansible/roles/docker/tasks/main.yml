---
# Cai tu kho chinh thuc cua Docker, khong dung goi docker.io cua Ubuntu: ban do
# cu hon nhieu va thieu plugin `docker compose`.
- name: Thu muc khoa apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# force: false (mac dinh): khoa da co thi khong tai lai, nen chay lai khong doi gi.
- name: Khoa GPG cua kho Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: Doc kien truc dpkg
  ansible.builtin.command: dpkg --print-architecture
  register: docker_kien_truc
  changed_when: false
  check_mode: false

- name: Kho apt cua Docker
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: >
      deb [arch={{ docker_kien_truc.stdout }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
    owner: root
    group: root
    mode: "0644"
  register: docker_kho

# --check tren may moi: kho chua that su duoc ghi nen apt chua thay docker-ce.
# Bo qua thay vi bao loi gia; lan chay that se cai.
- name: Docker Engine va Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: "{{ docker_kho is changed }}"
  when: not (ansible_check_mode and docker_kho is changed)

- name: Bat dich vu docker
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not goldcast_trong_container
