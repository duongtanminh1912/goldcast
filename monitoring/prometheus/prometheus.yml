global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    site: goldcast
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: alertmanager
    static_configs:
      - targets: [alertmanager:9093]
  - job_name: goldcast-backend
    metrics_path: /actuator/prometheus
    scrape_timeout: 10s
    static_configs:
      - targets: [metrics-tunnel:19091]
        labels: {site: goldcast}
  - job_name: vps-node
    static_configs:
      - targets: [metrics-tunnel:19100]
        labels: {site: goldcast}
  - job_name: jenkins-operations
    static_configs:
      - targets: [jenkins-exporter:9110]
        labels: {site: goldcast}
  - job_name: public
    metrics_path: /probe
    params: {module: [https_release]}
    static_configs:
      - targets: [https://goldcast.click/api/release]
        labels: {site: goldcast}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
  - job_name: backend-readiness
    metrics_path: /probe
    params: {module: [http_ok]}
    static_configs:
      - targets: [http://metrics-tunnel:19091/actuator/health/readiness]
        labels: {site: goldcast}
    relabel_configs:
      - {source_labels: [__address__], target_label: __param_target}
      - {source_labels: [__param_target], target_label: instance}
      - {target_label: __address__, replacement: 'blackbox:9115'}
