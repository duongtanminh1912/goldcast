name: goldcast-monitoring
x-logging: &logging
  driver: json-file
  options: {max-size: '10m', max-file: '3'}
services:
  metrics-tunnel:
    build:
      context: .
      dockerfile: tunnel.Dockerfile
      args: {PYTHON_IMAGE: '${PYTHON_IMAGE:?}'}
    environment:
      MONITORING_SSH_HOST: ${MONITORING_SSH_HOST:?}
    volumes: ['./tunnel.sh:/config/tunnel.sh:ro']
    secrets: [ssh_key, known_hosts]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    logging: *logging
  prometheus:
    image: ${PROMETHEUS_IMAGE:?}
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.retention.time=7d', '--storage.tsdb.retention.size=512MB']
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 384m
    logging: *logging
  grafana:
    image: ${GRAFANA_IMAGE:?}
    user: '0:0'
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SERVER_ROOT_URL: http://127.0.0.1:3001/
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    logging: *logging
  alertmanager:
    image: ${ALERTMANAGER_IMAGE:?}
    user: '0:0'
    command: ['--config.file=/etc/alertmanager/alertmanager.yml', '--storage.path=/alertmanager', '--cluster.listen-address=']
    ports: ['127.0.0.1:9093:9093']
    volumes:
      - ${MONITORING_SECRETS_DIR:?}/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    secrets: [telegram_bot_token]
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging
  blackbox:
    image: ${BLACKBOX_IMAGE:?}
    command: ['--config.file=/etc/blackbox.yml']
    volumes: ['./blackbox.yml:/etc/blackbox.yml:ro']
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    mem_limit: 64m
    logging: *logging
  jenkins-exporter:
    image: ${PYTHON_IMAGE:?}
    command: ['python3', '/app/jenkins_exporter.py']
    environment: {JENKINS_URL: '${MONITORING_JENKINS_URL:-http://host.docker.internal:8081}'}
    volumes: ['./jenkins_exporter.py:/app/jenkins_exporter.py:ro']
    secrets: [jenkins_auth]
    read_only: true
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging
volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
secrets:
  telegram_bot_token: {file: '${MONITORING_SECRETS_DIR:?}/telegram_bot_token'}
  grafana_admin_password: {file: '${MONITORING_SECRETS_DIR:?}/grafana_admin_password'}
  ssh_key: {file: '${MONITORING_SSH_KEY:?}'}
  known_hosts: {file: '${MONITORING_KNOWN_HOSTS:?}'}
  jenkins_auth: {file: '${MONITORING_SECRETS_DIR:?}/jenkins_auth.json'}
