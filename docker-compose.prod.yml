# Compose cho may chu that. File DOC LAP, khong phai override cua
# docker-compose.yml - de doc tron ven mot file thay vi ghep hai file
# trong dau. Tach rieng de chi ro cac cong duoc publish tren production.
#
# Khac ban dev:
#   - khong build, chi keo image tu GHCR
#   - KHONG publish cong nao cho db/backend/frontend
#   - chi Caddy publish 80 va 443
# Bound per-container logs; release retention is an explicit maintenance command.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  db:
    image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: goldcast-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - goldcast-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE from the tested release.env}
    container_name: goldcast-backend
    depends_on:
      db:
        condition: service_healthy
    # Metrics are reachable only via localhost/SSH, never the public interface.
    ports:
      - "127.0.0.1:9091:9091"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      APP_RELEASE_ID: ${RELEASE_ID:?Set RELEASE_ID from release.env}
      MANAGEMENT_SERVER_PORT: "9091"
      # Ingest thu du lieu tu provider; seed mo phong chi bat khi chu dong chon.
      APP_INGEST_ENABLED: ${APP_INGEST_ENABLED:-true}
      APP_INGEST_SEED_ON_EMPTY: ${APP_INGEST_SEED_ON_EMPTY:-false}
      APP_INGEST_CRON: ${APP_INGEST_CRON:-0 7 * * * *}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN}
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      # 60s chu khong 40s: 1 vCPU khoi dong JVM cham hon may ca nhan.
      start_period: 60s
    logging: *logging
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE from the tested release.env}
    container_name: goldcast-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL_INTERNAL: http://backend:8080
      GOLDCAST_RELEASE_ID: ${RELEASE_ID:?Set RELEASE_ID from release.env}
      TZ: Asia/Ho_Chi_Minh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/release',{signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 8s
      retries: 30
      start_period: 15s
    logging: *logging
    restart: unless-stopped

  caddy:
    image: caddy@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: goldcast-caddy
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging
    restart: unless-stopped

volumes:
  goldcast-pgdata:
  caddy-data:
  caddy-config:
